name: pages - Deploy to GitHub Pages

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'pages/**'

  workflow_dispatch:

# GitHub Pagesへのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行の制御（古いビルドをキャンセル）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: pages/package-lock.json

      - name: Install dependencies
        working-directory: ./pages
        run: npm ci

      - name: Build
        working-directory: ./pages
        env:
          FEEDBACK_DISCORD_WEBHOOK_URL: ${{ secrets.FEEDBACK_DISCORD_WEBHOOK_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
